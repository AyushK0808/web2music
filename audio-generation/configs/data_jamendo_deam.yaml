# Data pipeline config for the fine-tuning track (FEATURE_DESCRIPTION.md Phase 1).
# Consumed by `python -m data.prepare --config configs/data_jamendo_deam.yaml`.

seed: 42
raw_dir: data_raw
processed_dir: data_processed

jamendo:
  # Metadata lives in the mtg-jamendo-dataset repo itself (data/autotagging_moodtheme.tsv);
  # download.py pulls the actual audio from MTG's mirrors.
  repo_url: https://github.com/MTG/mtg-jamendo-dataset.git
  metadata_tsv: data/autotagging_moodtheme.tsv   # path inside the cloned repo
  download_script: scripts/download/download.py
  dataset: autotagging_moodtheme
  audio_type: audio-low       # ~46 GB; use `audio` for full quality (~500 GB)
  mirror: mtg-fast            # mtg-fast (Finland) or mtg (Spain)
  # Instrumental filter: MTG-Jamendo has no direct "instrumental" tag (verified
  # against the actual taxonomy — genre/instrument/moodtheme all lack one; the
  # closest things are genre---instrumentalpop/instrumentalrock, which are
  # subgenres, not a vocal/instrumental marker). The closest real signal is the
  # ABSENCE of instrument---voice in the separate instrument-tags file (only
  # ~57% of moodtheme tracks have any instrument annotation at all, so this
  # tag check alone is weak — the VAD check below is the load-bearing filter,
  # per FEATURE_DESCRIPTION.md).
  instrument_tsv: data/autotagging_instrument.tsv   # path inside the cloned repo
  vocal_tag: "instrument---voice"
  vad_check:
    enabled: true
    frame_ms: 30
    aggressiveness: 2          # webrtcvad 0-3, higher = more aggressive voice rejection
    max_voiced_ratio: 0.05     # reject if >5% of frames look voiced

deam:
  base_url: https://cvml.unige.ch/databases/DEAM
  files:
    audio: DEAM_audio.zip            # ~1.3 GB
    annotations: DEAM_Annotations.zip # ~4.7 MB, per-0.5s + per-song V-A
    metadata: metadata.zip            # duration/genre/folksonomy tags

nrc_vad:
  version: v2.1
  url: http://saifmohammad.com/WebDocs/Lexicons/NRC-VAD-Lexicon-v2.1.zip
  license_note: >
    Non-commercial research use only per saifmohammad.com/WebPages/nrc-vad.html;
    do not redistribute the raw lexicon file.

preprocess:
  sample_rate: 32000
  channels: 1
  target_lufs: -23.0
  crop_seconds: [10, 15]
  near_duplicate:
    method: chroma_hash
    similarity_threshold: 0.97

tempo:
  tracker: madmom            # madmom | beat_this | librosa (librosa = dev fallback only)
  sanity_check_dataset: giantsteps_tempo
  max_acceptable_mae_bpm: 4.0
  octave_error_tolerance: 0.02  # treat as pass if within tolerance after half/double correction

artist_split:
  val_frac: 0.1
  test_frac: 0.1
  exclude_deam_test_artists_from_probe: true

encodec:
  model_id: facebook/encodec_32khz
  num_codebooks: 4
  frame_rate_hz: 50
  cache_dir: data_processed/encodec_tokens

fad_reference:
  jamendo_test_holdout: true
  song_describer:
    url: https://zenodo.org/records/10072001  # Song Describer Dataset (CC audio)
